<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who answers the syscall? (the game) — Adrian.Marza</title>
  <meta name="description" content="The talk played as a platformer: the deck's Mario mode.">
  <link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../assets/tokens.css">
  <link rel="stylesheet" href="../../../assets/base.css">
  <link rel="stylesheet" href="../../../assets/components.css">
  <script>
    // Mario mode is part of the deck now (#mode=mario); this address, from before that,
    // keeps working. "#12" here opens slide 12.
    (() => {
      const slide = Number(location.hash.slice(1)) || 1;
      const deck = new URL('../', location.href);
      deck.hash = `slide=${slide}&mode=mario`;
      addEventListener('DOMContentLoaded', () => { document.querySelector('#play').href = deck.href; });
      location.replace(deck.href);
    })();
  </script>
</head>
<body>
  <main class="page-shell">
    <h1>Who answers the syscall?</h1>
    <p>Opening the talk as a game… If nothing happens, <a id="play" href="../#slide=1&amp;mode=mario">play it here</a>, or read the <a href="../">slides</a>.</p>
  </main>
</body>
</html>
