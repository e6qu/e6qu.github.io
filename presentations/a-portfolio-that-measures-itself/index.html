<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A portfolio that measures itself — Adrian.Marza</title>
  <meta name="description" content="Sample technical talk using every slide template: how e6qu.github.io measures its projects.">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem('theme'); } catch {}
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
        ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="../../assets/tokens.css">
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="stylesheet" href="../../assets/components.css">
  <link rel="stylesheet" href="../../assets/slides.css">
  <script src="../../assets/theme-toggle.js" defer></script>
  <script src="../../assets/runner.js" defer></script>
  <script src="../../assets/slides.js" defer></script>
  <script src="../../assets/deck-markdown.js" defer></script>
</head>
<!-- The talk is written in slides.md; edit it there or open it in ../editor/. -->
<body>
  <main class="deck" data-markdown="slides.md"></main>
  <div class="page-controls"><a class="button when-overview" id="edit-deck" hidden>Edit Markdown</a><button class="button when-overview" type="button" id="print-deck">Save as PDF</button><button class="icon-button" id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden><span aria-hidden="true">☾</span></button></div>
</body>
</html>
