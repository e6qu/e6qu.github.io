name: Refresh and publish portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install line-count parsers
        run: python -m pip install -r requirements.txt
      - name: Install cloc 2.10
        run: |
          curl --fail --location --retry 3 https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl --output /tmp/cloc.pl
          echo 'bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  /tmp/cloc.pl' | sha256sum --check
      - name: Test collection and rendering
        run: |
          python -m unittest discover -s tests -v
          node --check assets/site.js
          node --check assets/termites.js
          node --check assets/mario.js
          node --test tests/termites.test.cjs
      - name: Refresh public projects and measure source and tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py --cloc /tmp/cloc.pl --output data.json
      - name: Build static pages
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
